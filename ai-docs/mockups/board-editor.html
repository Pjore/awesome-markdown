<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup — board editor (create / edit)</title>
<style>
@font-face { font-family: 'JetBrains Mono'; src: url('../../apps/kanban-ui/public/fonts/JetBrainsMono-Regular.woff2') format('woff2'); font-weight: 400; }
@font-face { font-family: 'JetBrains Mono'; src: url('../../apps/kanban-ui/public/fonts/JetBrainsMono-Medium.woff2') format('woff2'); font-weight: 500; }
@font-face { font-family: 'Inter Tight'; src: url('../../apps/kanban-ui/public/fonts/InterTight-Regular.woff2') format('woff2'); font-weight: 400; }
@font-face { font-family: 'Inter Tight'; src: url('../../apps/kanban-ui/public/fonts/InterTight-Medium.woff2') format('woff2'); font-weight: 500; }

:root {
  --bg: #FAFAF7; --surface: #FAFAF7; --ink: #111111; --ink-muted: #6B6760;
  --border: #E6E4DD; --accent: #FFE94A; --on-accent: #111111;
  --font-mono: 'JetBrains Mono', monospace; --font-sans: 'Inter Tight', sans-serif;
  --drawer: 460px;
}
[data-theme="dark"] {
  --bg: #0E0E0E; --surface: #0E0E0E; --ink: #E8E8E8; --ink-muted: #8A867E;
  --border: #262626; --accent: #F5E663; --on-accent: #111111;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-sans); font-size: 14px; line-height: 1.45; }
button, input, select, textarea { border-radius: 0; font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code, .mono { font-family: var(--font-mono); }
code { font-size: 12px; }
.muted { color: var(--ink-muted); }

/* Reviewer-only strip, not part of the product */
.mockbar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 6px 40px; background: var(--ink); color: var(--bg); font: 11px var(--font-mono); }
.mockbar button { background: none; border: 1px solid currentColor; color: inherit; padding: 2px 8px; cursor: pointer; font-size: 11px; }
.mockbar button.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.mockbar .sep { opacity: .4; }

.topbar { height: 48px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 40px; border-bottom: 1px solid var(--border); font: 12px var(--font-mono); background: var(--bg); }
.chrome { position: sticky; top: 0; z-index: 20; }
.topbar .mark { font-weight: 500; }
.topbar .crumb a { color: var(--ink-muted); text-decoration: none; }
.topbar .right { justify-self: end; display: flex; gap: 8px; align-items: center; color: var(--ink-muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink); display: inline-block; }

main { padding: 28px 40px 96px; transition: margin-right .15s; }
main.with-drawer { margin-right: var(--drawer); }

/* Board header */
.title-input { width: 100%; max-width: 720px; font: 500 30px/1.2 var(--font-sans); border: 0; border-bottom: 1px solid transparent; background: transparent; padding: 2px 0 6px; }
.title-input:hover { border-bottom-color: var(--border); }
.title-input:focus { outline: none; border-bottom-color: var(--ink); }
.desc-input { width: 100%; max-width: 720px; border: 0; background: transparent; padding: 2px 0; font-size: 14px; color: var(--ink-muted); }
.desc-input:focus { outline: none; color: var(--ink); }
.meta { display: flex; flex-wrap: wrap; gap: 6px 20px; align-items: center; font: 12px var(--font-mono); color: var(--ink-muted); margin: 10px 0 28px; }
.meta input { font: 12px var(--font-mono); border: 0; border-bottom: 1px dashed var(--ink-muted); background: transparent; width: 18ch; padding: 0; color: var(--ink); }
.meta b { color: var(--ink); font-weight: 400; }

.edit { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border: 1px solid transparent; background: none; cursor: pointer; color: var(--ink-muted); padding: 0; flex: none; }
.edit:hover { color: var(--ink); border-color: var(--border); }
.edit.on { color: var(--on-accent); background: var(--accent); }
.edit svg { width: 12px; height: 12px; }

/* Board canvas */
.grid { display: grid; gap: 8px; align-items: stretch; overflow-x: auto; padding-bottom: 4px; }
.corner { }
.colh, .laneh { position: relative; font: 500 11px var(--font-mono); user-select: none; }
.colh { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 6px; align-items: center; padding: 0 0 6px; border-bottom: 1px solid var(--ink); text-transform: uppercase; letter-spacing: .06em; cursor: grab; }
.colh small, .laneh small { grid-column: 1 / -1; font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.laneh { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 6px; align-content: start; align-items: center; padding: 8px 6px 8px 0; border-top: 1px solid var(--border); cursor: grab; }
.grip { color: var(--ink-muted); font-size: 12px; visibility: hidden; }
.colh:hover .grip, .laneh:hover .grip { visibility: visible; }
.sel.colh { box-shadow: inset 0 -3px 0 var(--accent); }
.sel.laneh { box-shadow: inset 3px 0 0 var(--accent); padding-left: 8px; }
.ghost { cursor: default; color: var(--ink-muted); font-weight: 400; text-transform: none; letter-spacing: 0; }
.dragging { opacity: .4; }
.colh.drop-before::before, .colh.drop-after::after { content: ''; position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--accent); outline: 1px solid var(--ink); }
.colh.drop-before::before { left: -5px; } .colh.drop-after::after { right: -5px; }
.laneh.drop-before::before, .laneh.drop-after::after { content: ''; position: absolute; left: 0; right: -8px; height: 2px; background: var(--accent); outline: 1px solid var(--ink); }
.laneh.drop-before::before { top: -5px; } .laneh.drop-after::after { bottom: -5px; }
.rename { font: 500 11px var(--font-mono); text-transform: uppercase; letter-spacing: .06em; border: 0; border-bottom: 1px solid var(--accent); background: transparent; padding: 0; width: 100%; min-width: 0; }
.rename:focus { outline: none; }
.laneh .rename { text-transform: none; letter-spacing: 0; }

.plus { font: 16px var(--font-mono); border: 1px dashed var(--ink-muted); background: transparent; color: var(--ink-muted); cursor: pointer; padding: 0; }
.plus:hover { border-style: solid; border-color: var(--ink); color: var(--ink); background: color-mix(in srgb, var(--accent) 35%, transparent); }
.plus-col { width: 36px; align-self: end; height: 36px; margin-bottom: 1px; }
.plus-row { height: 36px; }

.cell { border: 1px solid var(--border); min-height: 84px; padding: 6px; display: flex; flex-direction: column; gap: 4px; }
.cell.ro { border-style: dashed; border-color: var(--ink-muted); }
.cell .ro-tag { font: 10px var(--font-mono); color: var(--ink-muted); }
.card { border: 1px solid var(--border); padding: 5px 8px; font-size: 13px; background: var(--surface); }
.card .t { font: 10px var(--font-mono); color: var(--ink-muted); display: block; }
.more { font: 11px var(--font-mono); color: var(--ink-muted); }
.homeless { margin-top: 20px; border-top: 1px solid var(--border); padding-top: 10px; font-size: 12px; }
.hint { font: 11px var(--font-mono); color: var(--ink-muted); margin-top: 14px; }

/* Drawer */
.drawer { position: fixed; top: var(--chrome, 78px); right: 0; bottom: 56px; width: var(--drawer); border-left: 1px solid var(--ink); background: var(--bg); overflow: auto; z-index: 15; }
.drawer-h { position: sticky; top: 0; background: var(--bg); display: flex; align-items: baseline; gap: 10px; padding: 16px 20px 12px; border-bottom: 1px solid var(--border); z-index: 2; }
.drawer-h .kind { font: 11px var(--font-mono); color: var(--ink-muted); }
.drawer-h h3 { font: 500 17px var(--font-sans); margin: 0; }
.drawer-h .x { margin-left: auto; }
.drawer-b { padding: 16px 20px 24px; }
.sub { padding: 16px 0; border-top: 1px dashed var(--border); }
.sub:first-child { border-top: 0; padding-top: 0; }
h4 { font: 500 12px var(--font-mono); margin: 0 0 6px; }
.help { color: var(--ink-muted); font-size: 13px; margin: 0 0 10px; }
.warn { font-size: 13px; margin: 0 0 10px; padding: 8px 10px; border: 1px dashed var(--ink-muted); }
.notice { font-size: 13px; padding: 10px 12px; border-left: 3px solid var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); margin-bottom: 16px; }
.field-row { display: flex; gap: 10px; flex-wrap: wrap; }
.field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 150px; }
.field.narrow { flex: 0 1 auto; min-width: 0; }
.lbl { font: 11px var(--font-mono); color: var(--ink-muted); }
.field input, .field select { border: 1px solid var(--border); background: transparent; padding: 6px 8px; font-size: 13px; }
.field input.sans { font-family: var(--font-sans); font-size: 14px; }
.static { padding: 6px 0; font-size: 12px; color: var(--ink-muted); }
.segs { display: inline-flex; margin-bottom: 10px; flex-wrap: wrap; }
.seg { font: 12px var(--font-mono); border: 1px solid var(--border); background: transparent; padding: 5px 10px; cursor: pointer; margin-left: -1px; }
.seg:first-child { margin-left: 0; }
.seg.on { background: var(--ink); color: var(--bg); border-color: var(--ink); position: relative; }
.default-tag { font: 10px var(--font-mono); color: var(--ink-muted); border: 1px solid var(--border); padding: 0 4px; margin-left: 6px; vertical-align: 1px; }
.fb { display: flex; flex-direction: column; gap: 6px; }
.fb-head { font-size: 13px; display: flex; gap: 6px; align-items: center; }
.fb-head select { border: 1px solid var(--border); background: transparent; padding: 2px 4px; font: 12px var(--font-mono); }
.fb-row { display: grid; grid-template-columns: minmax(0, 1fr) 118px minmax(0, 1fr) 22px; gap: 6px; }
.fb-row input, .fb-row select, .wod-row input, .wod-row select { border: 1px solid var(--border); background: transparent; padding: 5px 7px; font: 12px var(--font-mono); min-width: 0; }
.fb-row .joiner { grid-column: 1 / -1; font: 11px var(--font-mono); color: var(--ink-muted); padding-left: 8px; }
.wod-row { display: grid; grid-template-columns: 84px minmax(0, 1fr) minmax(0, 1fr) 22px; gap: 6px; margin-bottom: 6px; }
.x { border: 0; background: none; cursor: pointer; color: var(--ink-muted); font-size: 16px; padding: 0; }
.x:hover { color: var(--ink); }
.fb-foot { display: flex; justify-content: space-between; align-items: baseline; font: 11px var(--font-mono); color: var(--ink-muted); }
.btn { font: 12px var(--font-mono); border: 1px solid var(--border); background: transparent; padding: 6px 12px; cursor: pointer; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.primary:disabled { opacity: .35; cursor: not-allowed; }
.link { font: 12px var(--font-mono); background: none; border: 0; padding: 4px 0; cursor: pointer; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--border); }
.link:hover { text-decoration-color: var(--ink); }
.drawer-actions { display: flex; gap: 12px; align-items: center; padding-top: 14px; border-top: 1px dashed var(--border); }
.file { margin-bottom: 20px; }
.file-h { display: flex; gap: 10px; align-items: baseline; font: 12px var(--font-mono); padding: 6px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.file-h .st { font-size: 11px; padding: 0 5px; border: 1px solid var(--ink); }
.file-h .st.new { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.file-h .note { color: var(--ink-muted); font-size: 11px; }
pre { font: 12px/1.6 var(--font-mono); margin: 8px 0 0; white-space: pre-wrap; }

.savebar { position: fixed; left: 0; right: 0; bottom: 0; height: 56px; border-top: 1px solid var(--border); background: var(--bg); display: flex; align-items: center; gap: 16px; padding: 0 40px; z-index: 20; font: 12px var(--font-mono); }
.savebar .sum { color: var(--ink-muted); margin-right: auto; }
.savebar .sum b { color: var(--ink); font-weight: 500; }
</style>
</head>
<body>

<div class="chrome" id="chrome">
<div class="mockbar">
  <span>mockup · board editor</span><span class="sep">|</span>
  <span>state</span>
  <button type="button" data-act="mode" data-mode="edit" id="m-edit">edit board-dev</button>
  <button type="button" data-act="mode" data-mode="create" id="m-create">create new</button>
  <span class="sep">|</span>
  <button type="button" data-act="theme">toggle theme</button>
  <span class="sep">|</span>
  <span>try: + to add · drag headers to reorder · pencil to configure · double-click a title to rename</span>
</div>

<header class="topbar">
  <span class="mark">awesome-markdown</span>
  <span class="crumb" id="crumb"></span>
  <span class="right"><span class="dot" title="synced"></span> synced</span>
</header>
</div>

<main id="main"></main>
<aside class="drawer" id="drawer" hidden></aside>
<footer class="savebar" id="savebar"></footer>

<datalist id="props"></datalist>
<div id="vals"></div>

<script>
// ---------------------------------------------------------------- mock data
const ITEMS = [
  { slug: 'fix-auth-bug', title: 'Fix auth token refresh', project: 'dev', status: 'doing', priority: 'high', tags: ['urgent', 'auth'], assignee: 'anna', ord: 1, updatedAt: '2026-09-29' },
  { slug: 'refactor-db', title: 'Refactor DB access layer', project: 'dev', status: 'done', priority: 'high', tags: ['db'], assignee: 'erik', ord: 2, updatedAt: '2026-09-20' },
  { slug: 'add-sso', title: 'Add SSO login', project: 'dev', status: 'todo', priority: 'high', tags: ['auth', 'urgent'], assignee: 'anna', ord: 3, updatedAt: '2026-09-27' },
  { slug: 'flaky-ci', title: 'Quarantine flaky CI job', project: 'dev', status: 'todo', priority: 'medium', tags: ['ci', 'urgent'], ord: 4, updatedAt: '2026-09-28' },
  { slug: 'upgrade-node', title: 'Upgrade to Node 24', project: 'dev', status: 'complete', priority: 'high', tags: [], assignee: 'erik', ord: 5, updatedAt: '2026-09-10' },
  { slug: 'rate-limit', title: 'Rate-limit public API', project: 'dev', status: 'doing', priority: 'high', tags: [], ord: 6, updatedAt: '2026-09-25' },
  { slug: 'docs-cleanup', title: 'Clean up README', project: 'dev', status: 'todo', priority: 'low', tags: [], ord: 7, updatedAt: '2026-09-18' },
  { slug: 'onboard-ml', title: 'Onboard ML team', project: 'marketing', status: 'doing', priority: 'low', tags: [], ord: 8, updatedAt: '2026-09-26' },
  { slug: 'launch-post', title: 'Write launch post', project: 'marketing', status: 'todo', priority: 'high', tags: ['urgent'], assignee: 'lisa', ord: 9, updatedAt: '2026-09-29' },
  { slug: 'press-kit', title: 'Assemble press kit', project: 'marketing', status: 'review', priority: 'medium', tags: [], assignee: 'lisa', ord: 10, updatedAt: '2026-09-24' },
];
const PROPS = ['status', 'priority', 'tags', 'project', 'assignee', 'title', 'updatedAt'];

const C = (p, o, v) => ({ p, o, v });
const F = (comb, conds) => ({ comb, conds });
const DEFAULT_ORDER = { mode: 'manual' };
const LIB = {
  'all': { title: 'Show all', filter: null, order: { mode: 'manual' }, wod: null },
  'priority-high': { title: 'High Priority', filter: F('all', [C('priority', 'equals', 'high')]), order: { mode: 'manual' }, wod: null },
  'tag-urgent': { title: 'Urgent', filter: F('all', [C('tags', 'has', 'urgent')]), order: { mode: 'manual' },
    wod: [{ op: 'append', path: 'tags', value: 'urgent' }, { op: 'set', path: 'priority', value: 'high' }] },
  'status-todo': { title: 'To Do', filter: F('all', [C('status', 'equals', 'todo')]), order: { mode: 'manual' }, wod: null },
  'status-doing': { title: 'Doing', filter: F('all', [C('status', 'equals', 'doing')]), order: { mode: 'manual' }, wod: null },
  'status-done': { title: 'Done', filter: F('any', [C('status', 'equals', 'done'), C('status', 'equals', 'complete')]), order: { mode: 'default' }, wod: null },
};
const OTHER_BOARDS = { 'board-all': { columns: ['status-todo', 'status-doing', 'status-done'], swimlanes: ['all'] } };

const OPS = [['equals', 'is'], ['in', 'is one of'], ['has', 'contains'], ['lacks', "doesn't contain"], ['exists_t', 'is set'], ['exists_f', 'is not set'],
  ['gt', '>'], ['gte', '≥'], ['lt', '<'], ['lte', '≤'], ['matches', 'matches regex']];
const OPWORD = Object.fromEntries(OPS);
const PENCIL = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M11 2.5l2.5 2.5L5 13.5H2.5V11z"/><path d="M9.5 4l2.5 2.5"/></svg>';

// ---------------------------------------------------------------- state
let S;
const clone = (o) => JSON.parse(JSON.stringify(o));
function init(mode) {
  S = mode === 'edit' ? {
    mode, slug: 'board-dev', title: 'Dev Board', desc: 'Development-project items only.',
    scope: F('all', [C('project', 'equals', 'dev')]),
    columns: ['priority-high', 'tag-urgent'],
    swimlanes: ['status-todo', 'status-doing', 'status-done'],
  } : {
    mode, slug: 'marketing-launch', title: 'Marketing launch', desc: '',
    scope: F('all', [C('project', 'equals', 'marketing')]),
    columns: [], swimlanes: [],
  };
  Object.assign(S, { axes: clone(LIB), drawer: null, renaming: null, dirty: new Set(), newAxes: new Set(), boardDirty: false, slugTouched: false });
  render();
}

// ---------------------------------------------------------------- domain helpers
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const slugify = (t) => (t.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'untitled');
const listVals = (v) => String(v).split(',').map((s) => s.trim()).filter(Boolean);
function cmp(a, b) {
  const na = Number(a), nb = Number(b);
  if (a !== '' && b !== '' && !isNaN(na) && !isNaN(nb)) return na - nb;
  return String(a).localeCompare(String(b));
}
function evalLeaf(c, it) {
  if (!c.p) return true;
  const val = it[c.p];
  switch (c.o) {
    case 'equals': return val !== undefined && String(val) === c.v;
    case 'in': return listVals(c.v).includes(String(val));
    case 'has': return Array.isArray(val) && val.includes(c.v);
    case 'lacks': return !(Array.isArray(val) && val.includes(c.v));
    case 'exists_t': return val !== undefined && val !== null;
    case 'exists_f': return val === undefined || val === null;
    case 'gt': return val !== undefined && cmp(val, c.v) > 0;
    case 'gte': return val !== undefined && cmp(val, c.v) >= 0;
    case 'lt': return val !== undefined && cmp(val, c.v) < 0;
    case 'lte': return val !== undefined && cmp(val, c.v) <= 0;
    case 'matches': try { return new RegExp(c.v).test(String(val ?? '')); } catch { return false; }
  }
  return true;
}
function evalF(f, it) {
  if (!f || !f.conds.length) return true;
  return f.comb === 'any' && f.conds.length > 1 ? f.conds.some((c) => evalLeaf(c, it)) : f.conds.every((c) => evalLeaf(c, it));
}
const inScope = (it) => evalF(S.scope, it);
function condText(c) {
  if (!c.p) return '…';
  if (c.o.startsWith('exists')) return `${c.p} ${OPWORD[c.o]}`;
  if (c.o === 'in') return `${c.p} is ${listVals(c.v).join(' / ') || '…'}`;
  return `${c.p} ${OPWORD[c.o]} ${c.v || '…'}`;
}
function filterSummary(f, none = 'all cards') {
  if (!f || !f.conds.length) return none;
  return f.conds.map(condText).join(f.comb === 'any' ? ' or ' : ' and ');
}
// Mirrors filter-engine/invertibility.ts
function derive(f) {
  if (!f || !f.conds.length) return { ok: true, writes: [] };
  if (f.comb === 'any' && f.conds.length > 1) return { ok: false, why: '"match any" can\'t tell which condition to make true' };
  const writes = [];
  for (const c of f.conds) {
    if (!c.p) continue;
    if (c.o === 'equals') writes.push(`set ${c.p}: ${c.v}`);
    else if (c.o === 'in') {
      const vs = listVals(c.v);
      if (vs.length !== 1) return { ok: false, why: `"${c.p} is one of" several values — which one should a drop write?` };
      writes.push(`set ${c.p}: ${vs[0]}`);
    } else if (c.o === 'has') writes.push(`append ${c.p}: ${c.v}`);
    else if (c.o === 'lacks') writes.push(`remove ${c.p}: ${c.v}`);
    else if (c.o === 'exists_f') writes.push(`delete ${c.p}`);
    else return { ok: false, why: `"${condText(c)}" describes a range, not a value to write` };
  }
  return { ok: true, writes };
}
function dropInfo(ax) {
  if (ax.wod === 'readonly') return { ro: true };
  if (Array.isArray(ax.wod)) return { ro: false };
  return { ro: !derive(ax.filter).ok };
}
function usage(slug) {
  const out = [];
  for (const [b, def] of Object.entries(OTHER_BOARDS)) {
    if (S.mode === 'edit' && b === S.slug) continue;
    if (def.columns.includes(slug)) out.push({ board: b, dim: 'column' });
    if (def.swimlanes.includes(slug)) out.push({ board: b, dim: 'swimlane' });
  }
  return out;
}
function orderText(o) {
  if (o.mode === 'manual') return 'manual';
  if (o.mode === 'property') return `by ${o.by || '…'} ${o.dir === 'desc' ? '↓' : '↑'}`;
  return 'recently updated';
}
function sortItems(items, o) {
  const arr = [...items];
  if (o.mode === 'manual') return arr.sort((a, b) => a.ord - b.ord);
  if (o.mode === 'property' && o.by) {
    return arr.sort((a, b) => {
      const va = a[o.by], vb = b[o.by];
      if (va !== undefined && vb !== undefined) { const r = cmp(va, vb); if (r) return o.dir === 'desc' ? -r : r; }
      return b.updatedAt.localeCompare(a.updatedAt);
    });
  }

function addAxis(dim) {
  const base = dim === 'columns' ? 'New column' : 'New swimlane';
  const slug = uniqueSlug(slugify(base));
  S.axes[slug] = { title: base, filter: null, order: { ...DEFAULT_ORDER }, wod: null };
  S.newAxes.add(slug);
  S[dim].push(slug);
  S.renaming = slug;
  S.boardDirty = true;
}
function commitRename(slug, value) {
  const ax = S.axes[slug];
  if (!ax) return;
  if (value.trim()) ax.title = value.trim();
  S.renaming = null;
  if (S.newAxes.has(slug)) {
    const next = uniqueSlug(slugify(ax.title), slug);
    if (next !== slug) {
      S.axes[next] = ax; delete S.axes[slug];
      S.newAxes.delete(slug); S.newAxes.add(next);
      for (const dim of ['columns', 'swimlanes']) S[dim] = S[dim].map((s) => (s === slug ? next : s));
      if (S.drawer?.slug === slug) S.drawer.slug = next;
    }
  } else touch(slug);
}

    case 'drop-mode': {
      const m = b.dataset.mode;
      if (m === 'auto') ax.wod = null;
      else if (m === 'readonly') ax.wod = 'readonly';
      else if (!Array.isArray(ax.wod)) {
        const d = derive(ax.filter);
        ax.wod = d.ok && d.writes.length
          ? d.writes.map((w) => { const [op, rest] = w.split(/ (.*)/); const [path, value = ''] = rest.split(': '); return { op, path, value }; })
          : [{ op: 'set', path: '', value: '' }];
      }
      touch(slug); break;
    }
    case 'wod-add': ax.wod.push({ op: 'set', path: '', value: '' }); touch(slug); break;
    case 'wod-del': ax.wod.splice(+b.dataset.i, 1); touch(slug); break;
    case 'remove':
      S[dim] = S[dim].filter((s) => s !== slug);
      if (S.newAxes.has(slug)) { delete S.axes[slug]; S.newAxes.delete(slug); }
      S.drawer = null; S.boardDirty = true; break;
    case 'fork': {
      const copy = uniqueSlug(`${slug}-${S.slug.replace(/^board-/, '')}`);
      S.axes[copy] = clone(ax);
      S.newAxes.add(copy); S.dirty.delete(slug);
      S[dim] = S[dim].map((s) => (s === slug ? copy : s));
      S.drawer = { kind: 'axis', slug: copy, dim }; S.boardDirty = true; break;
    }
    default: return;
  }
  render();
});
document.addEventListener('dblclick', (e) => {
  const t = e.target.closest('[data-act="rename"]');
  if (!t) return;
  S.renaming = t.dataset.slug; render();
});

document.addEventListener('change', (e) => {
  const t = e.target;
  const d = t.dataset;
  if (d.rename) return;
  if (d.f) {
    const f = getF(d.f, true);
    if (d.k === 'comb') f.comb = t.value; else f.conds[+d.i][d.k] = t.value;
    touch(d.f);
  } else if (d.axis) {
    const ax = S.axes[d.axis];
    if (d.field === 'title') ax.title = t.value;
    if (d.field === 'order.by') ax.order.by = t.value;
    touch(d.axis);
  } else if (d.wod) {
    S.axes[d.wod].wod[+d.i][d.k] = t.value; touch(d.wod);
  } else if (d.board) {
    if (d.board === 'slug') { S.slug = slugify(t.value); S.slugTouched = true; } else S[d.board] = t.value;
    S.boardDirty = true;
  } else return;
  render();
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset.board === 'title' && S.mode === 'create' && !S.slugTouched) {
    S.slug = slugify(t.value);
    document.getElementById('slug-in').value = S.slug;
  }
});
document.addEventListener('keydown', (e) => {
  const t = e.target;
  if (t.dataset?.rename && (e.key === 'Enter' || e.key === 'Escape')) { e.preventDefault(); t.blur(); }
  else if (e.key === 'Escape' && S.drawer) { S.drawer = null; render(); }
});
document.addEventListener('focusout', (e) => {
  const t = e.target;
  if (t.dataset?.rename && S.renaming === t.dataset.rename) { commitRename(t.dataset.rename, t.value); render(); }
});

// Drag headers to reorder columns (horizontal) and swimlanes (vertical)
let dragging = null, dropAt = null;
const clearMarks = () => document.querySelectorAll('.drop-before, .drop-after').forEach((n) => n.classList.remove('drop-before', 'drop-after'));
document.addEventListener('dragstart', (e) => {
  const h = e.target.closest?.('[data-drag]');
  if (!h) return;
  dragging = { dim: h.dataset.dim, slug: h.dataset.slug };
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', h.dataset.slug);
  requestAnimationFrame(() => h.classList.add('dragging'));
});
document.addEventListener('dragover', (e) => {
  if (!dragging) return;
  const h = e.target.closest('[data-drag]');
  if (!h || h.dataset.dim !== dragging.dim) return;
  e.preventDefault();
  const r = h.getBoundingClientRect();
  const after = dragging.dim === 'columns' ? e.clientX > r.left + r.width / 2 : e.clientY > r.top + r.height / 2;
  clearMarks();
  if (h.dataset.slug !== dragging.slug) h.classList.add(after ? 'drop-after' : 'drop-before');
  dropAt = { slug: h.dataset.slug, after };
});
document.addEventListener('drop', (e) => {
  if (!dragging || !dropAt) return;
  e.preventDefault();
  if (dropAt.slug !== dragging.slug) {
    const list = S[dragging.dim].filter((s) => s !== dragging.slug);
    list.splice(list.indexOf(dropAt.slug) + (dropAt.after ? 1 : 0), 0, dragging.slug);
    S[dragging.dim] = list;
    S.boardDirty = true;
  }
  dragging = dropAt = null;
  render();
});
document.addEventListener('dragend', () => { dragging = dropAt = null; clearMarks(); document.querySelectorAll('.dragging').forEach((n) => n.classList.remove('dragging')); });

const syncChrome = () => document.documentElement.style.setProperty('--chrome', document.getElementById('chrome').offsetHeight + 'px');
window.addEventListener('resize', syncChrome);
syncChrome();
renderLists();
init('edit');
</script>
</body>
</html>
