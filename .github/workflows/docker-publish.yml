name: Docker Publish

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: Build and push ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: kanban-ui
            dockerfile: apps/kanban-ui/Dockerfile
            image: ghcr.io/pjore/awesome-markdown-kanban-ui
          - service: provider-fs
            dockerfile: apps/provider-fs/Dockerfile
            image: ghcr.io/pjore/awesome-markdown-provider-fs
          - service: sync-engine
            dockerfile: apps/sync-engine/Dockerfile
            image: ghcr.io/pjore/awesome-markdown-sync-engine

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        timeout-minutes: 40
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  trigger-board-deploy:
    name: Trigger Dokploy board redeploy
    needs: build-push
    runs-on: ubuntu-latest
    # Tag pushes don't hit Dokploy's main-branch autoDeploy webhook, and
    # provider-fs/sync-engine use pre-built images that a plain redeploy
    # wouldn't otherwise re-pull — trigger the board compose deploy directly
    # so it force-pulls the images just published above (see pull_policy:
    # always in docker-compose.dokploy.yml).
    steps:
      - name: Call compose.deploy
        run: |
          curl -sf -X POST https://dokploy.pjore.com/api/compose.deploy \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"composeId\": \"${{ vars.DOKPLOY_BOARD_COMPOSE_ID }}\", \"title\": \"Release ${{ github.ref_name }}\"}"

      # compose.deploy only confirms the request was queued, and composeStatus
      # can already read "done" from a stale previous run before the new one
      # even starts — polling for "done" alone would pass immediately without
      # proving anything changed (see incident 2026-09-27). Wait for status to
      # actually leave "done" (deploy in progress) before waiting for it to
      # return, so a silently-stale deploy fails loudly instead of going
      # unnoticed.
      - name: Wait for deploy to settle
        run: |
          status_url="https://dokploy.pjore.com/api/compose.one?composeId=${{ vars.DOKPLOY_BOARD_COMPOSE_ID }}"
          fetch_status() { curl -sf "$status_url" -H "x-api-key: ${{ secrets.DOKPLOY_API_KEY }}" | jq -r '.composeStatus'; }

          left_done=false
          for i in $(seq 1 12); do
            status=$(fetch_status)
            echo "composeStatus=$status (waiting to start, attempt $i)"
            [ "$status" = "error" ] && { echo "::error::Dokploy compose deploy failed (composeStatus=error)"; exit 1; }
            if [ "$status" != "done" ]; then left_done=true; break; fi
            sleep 5
          done
          [ "$left_done" = true ] || echo "::warning::composeStatus never left 'done' — deploy may not have been picked up yet, proceeding to final check anyway"

          for i in $(seq 1 30); do
            status=$(fetch_status)
            echo "composeStatus=$status (attempt $i)"
            [ "$status" = "done" ] && exit 0
            [ "$status" = "error" ] && { echo "::error::Dokploy compose deploy failed (composeStatus=error)"; exit 1; }
            sleep 10
          done
          echo "::error::Timed out waiting for composeStatus=done"
          exit 1
