name: NPM Publish

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # required for npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # npm trusted publishing (OIDC) requires npm CLI >= 11.5.1; pnpm publish
      # doesn't support OIDC, so each package is published with `npm publish`
      - run: npm install -g npm@latest
      - name: Build publishable packages
        run: |
          for pkg in contracts filter-engine core provider-http provider-localstorage board-ui; do
            pnpm --filter "@awesome-markdown/$pkg" build
          done
      - name: Publish changed packages (OIDC trusted publishing, no stored token)
        run: |
          # `pnpm pack` rewrites `workspace:*` deps to real versions; a plain
          # `npm publish` in the package dir would publish them verbatim.
          for pkg in contracts filter-engine core provider-http provider-localstorage board-ui; do
            dir="packages/$pkg"
            name=$(node -p "require('./$dir/package.json').name")
            local_version=$(node -p "require('./$dir/package.json').version")
            published_version=$(npm view "$name" version 2>/dev/null || echo "none")
            if [ "$local_version" = "$published_version" ]; then
              echo "skip $name@$local_version (already published)"
              continue
            fi
            tarball=$(cd "$dir" && pnpm pack --pack-destination "$RUNNER_TEMP" | tail -n 1)
            npm publish "$tarball" --access public
          done
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --generate-notes
